name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff mypy black
          pip install -e .

      - name: Ruff (non-blocking)
        continue-on-error: true
        run: python -m ruff check .

      - name: Black (non-blocking)
        continue-on-error: true
        run: python -m black --check .

      - name: Mypy (non-blocking)
        continue-on-error: true
        run: python -m mypy detm tests

      - name: Pytest
        run: pytest

  torch-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies (CPU Torch)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -e .

      - name: Pytest (including torch parity)
        run: pytest -q
