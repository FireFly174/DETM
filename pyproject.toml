[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "detm"
version = "0.0.0"
description = "Discrete Entropy-Time Model runtime"
requires-python = ">=3.12"
dependencies = [
  "numpy>=1.26",
  "msgpack>=1.0",
]

[project.optional-dependencies]
torch = ["torch"]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = [
  "detm*",
]

[tool.setuptools.package-data]
"detm.presets" = ["*.json"]

[tool.black]
line-length = 100
target-version = ["py312"]
extend-exclude = "/(legacy|experiments|examples|visualization|docs|runtime|tools|bundle_project\\.py)/"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["detm", "tests"]
extend-exclude = [
  "legacy",
  "experiments",
  "examples",
  "visualization",
  "docs",
  "tools",
  "bundle_project.py",
]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E203"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
files = ["detm", "tests"]

[tool.pytest.ini_options]
addopts = "-p no:napari"
