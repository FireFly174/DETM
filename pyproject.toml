[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "detm"
version = "0.2.2"
description = "Discrete Entropy-Time Model runtime"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.12"
authors = [
  {name = "DETM contributors"},
]
keywords = ["simulation", "runtime", "dynamics", "research", "detm"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: Other/Proprietary License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy>=2.4.4",
  "msgpack>=1.0",
]

[project.urls]
Homepage = "https://github.com/FireFly174/DETM"
Repository = "https://github.com/FireFly174/DETM"
Documentation = "https://github.com/FireFly174/DETM/tree/main/docs"
Issues = "https://github.com/FireFly174/DETM/issues"

[project.optional-dependencies]
torch = ["torch"]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = [
  "detm*",
]

[tool.setuptools.package-data]
"detm.presets" = ["*.json"]

[tool.black]
line-length = 100
target-version = ["py312"]
extend-exclude = "/(legacy|experiments|examples|visualization|docs|runtime|tools|bundle_project\\.py)/"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["detm", "tests"]
extend-exclude = [
  "legacy",
  "experiments",
  "examples",
  "visualization",
  "docs",
  "tools",
  "bundle_project.py",
]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E203"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
files = ["detm", "tests"]

[tool.pytest.ini_options]
addopts = "-p no:napari"
