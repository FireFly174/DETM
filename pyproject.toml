[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "detm"
version = "0.0.0"
description = "Discrete Entropy-Time Model runtime"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "msgpack>=1.0",
]

[tool.setuptools]
packages = []

[tool.black]
line-length = 100
target-version = ["py311"]
extend-exclude = "/(legacy|experiments|examples|visualization|docs|detm_logging|fallback|runtime|tools|bundle_project\\.py)/"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["core", "tests"]
extend-exclude = [
  "legacy",
  "experiments",
  "examples",
  "visualization",
  "docs",
  "detm_logging",
  "fallback",
  "runtime",
  "tools",
  "bundle_project.py",
]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E203"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
files = ["core", "tests"]
