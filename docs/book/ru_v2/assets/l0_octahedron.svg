<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="920" viewBox="0 0 1400 920">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .title { font-family: Arial, sans-serif; font-size: 40px; font-weight: 700; fill: #0f172a; }
      .sub { font-family: Arial, sans-serif; font-size: 20px; font-weight: 400; fill: #334155; }
      .h { font-family: Arial, sans-serif; font-size: 24px; font-weight: 700; fill: #0f172a; }
      .t { font-family: Arial, sans-serif; font-size: 18px; font-weight: 400; fill: #334155; }
      .stroke { stroke: #0f172a; stroke-width: 2; fill: none; }
      .cutline { stroke: #0f172a; stroke-width: 2.5; fill: none; }
      .dash { stroke: #64748b; stroke-width: 2; fill: none; stroke-dasharray: 7 7; }
      .outer { fill: #0f172a; opacity: 0.88; }
      .layer0 { fill: #e2e8f0; opacity: 0.92; }
      .layer1 { fill: #cbd5e1; opacity: 0.82; }
      .layer2 { fill: #b6c2d1; opacity: 0.72; }
      .layer3 { fill: #94a3b8; opacity: 0.62; }
      .layer4 { fill: #64748b; opacity: 0.50; }
      .spike { fill: #dc2626; opacity: 0.9; }
      .call { stroke: #64748b; stroke-width: 2; fill: none; marker-end: url(#m); }
      .pill { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 1.5; rx: 12; }
      .pilltext { font-family: Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
    </style>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1400" height="920"/>

  <text class="title" x="60" y="72">L0: базис как сфера со срезом (модель)</text>
  <text class="sub" x="60" y="106">Снаружи виден верхний смысловой слой. Внутренние слои становятся различимы только на срезе.</text>

  <!-- Sphere -->
  <circle cx="430" cy="520" r="250" class="outer"/>
  <circle cx="430" cy="520" r="250" class="stroke" style="opacity:0.6"/>

  <!-- Cut wedge -->
  <path d="M 430 520 L 700 450 A 250 250 0 0 1 700 610 Z" fill="#ffffff"/>
  <path d="M 430 520 L 700 450 A 250 250 0 0 1 700 610 Z" class="cutline"/>
  <path d="M 430 520 L 700 450" class="cutline"/>
  <path d="M 430 520 L 700 610" class="cutline"/>

  <!-- Layer wedges -->
  <path d="M 430 520 L 688 466 A 235 235 0 0 1 688 594 Z" class="layer4"/>
  <path d="M 430 520 L 650 478 A 200 200 0 0 1 650 570 Z" class="layer3"/>
  <path d="M 430 520 L 612 490 A 165 165 0 0 1 612 550 Z" class="layer2"/>
  <path d="M 430 520 L 575 500 A 130 130 0 0 1 575 540 Z" class="layer1"/>
  <path d="M 430 520 L 538 510 A 95 95 0 0 1 538 530 Z" class="layer0"/>

  <!-- Internal guides -->
  <path d="M 430 520 L 646 498" class="dash"/>
  <path d="M 430 520 L 646 542" class="dash"/>

  <!-- Distortion spikes on outer layers -->
  <polygon class="spike" points="646,498 692,488 690,512"/>
  <polygon class="spike" points="612,502 633,497 632,511" style="opacity:0.65"/>
  <polygon class="spike" points="575,506 586,503 586,511" style="opacity:0.35"/>

  <polygon class="spike" points="646,542 692,532 690,556"/>
  <polygon class="spike" points="612,538 633,533 632,547" style="opacity:0.65"/>
  <polygon class="spike" points="575,534 586,531 586,539" style="opacity:0.35"/>

  <rect class="pill" x="170" y="236" width="530" height="56"/>
  <text class="pilltext" x="190" y="270">Снаружи видно только «духовное / смысловое»</text>

  <!-- Layer callouts -->
  <path class="call" d="M 705 468 L 970 382"/>
  <text class="h" x="988" y="386">Духовное / смысловое</text>
  <text class="t" x="988" y="410">Внешняя поверхность, заметная снаружи.</text>

  <path class="call" d="M 690 496 L 970 454"/>
  <text class="h" x="988" y="458">Самоуважение</text>
  <text class="t" x="988" y="482">Пики и компенсации часто проявляются здесь.</text>

  <path class="call" d="M 666 522 L 970 526"/>
  <text class="h" x="988" y="530">Социальные связи</text>
  <text class="t" x="988" y="554">Контекст, статус, принадлежность.</text>

  <path class="call" d="M 630 548 L 970 598"/>
  <text class="h" x="988" y="602">Безопасность</text>
  <text class="t" x="988" y="626">Границы, риск, базовые гарантии.</text>

  <path class="call" d="M 542 520 L 970 670"/>
  <text class="h" x="988" y="674">Физиология (ядро)</text>
  <text class="t" x="988" y="698">Пики к центру затухают: в ядре колебание ближе к 0.</text>

  <rect class="pill" x="770" y="748" width="570" height="110"/>
  <text class="pilltext" x="792" y="782">Смысл модели</text>
  <text class="t" x="792" y="808">Компенсации и «пики» сильнее на внешних слоях.</text>
  <text class="t" x="792" y="834">Чтобы увидеть механику внутри, нужен срез: наблюдение и диагностика.</text>
</svg>
