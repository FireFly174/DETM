<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .title { font: 800 30px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial; fill: #0f172a; }
      .sub { font: 500 18px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial; fill: #334155; }
      .h { font: 800 16px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial; fill: #0f172a; }
      .t { font: 500 14px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial; fill: #334155; }
      .stroke { stroke: #0f172a; stroke-width: 2; fill: none; }
      .cut { stroke: #0f172a; stroke-width: 2.5; fill: none; }
      .dash { stroke: #64748b; stroke-width: 2; fill: none; stroke-dasharray: 7 7; }
      .layer0 { fill: #e2e8f0; }
      .layer1 { fill: #cbd5e1; }
      .layer2 { fill: #b6c2d1; }
      .layer3 { fill: #94a3b8; }
      .layer4 { fill: #0f172a; }
      .outer { fill: #0f172a; opacity: 0.88; }
      .call { stroke: #64748b; stroke-width: 2; fill: none; marker-end: url(#m); }
      .pill { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 1.5; rx: 12; }
      .pilltext { font: 700 14px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial; fill: #0f172a; }
      .spike { fill: #dc2626; opacity: 0.92; }
    </style>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1400" height="900"/>

  <text class="title" x="60" y="70">L0: базис как сфера со срезом (модель)</text>
  <text class="sub" x="60" y="105">Снаружи наблюдатель видит только внешний (смысловой) слой. Внутренние слои становятся видимыми только на срезе.</text>

  <!-- Sphere (full outside view) -->
  <!-- Center (430, 520), R=260 -->
  <circle cx="430" cy="520" r="260" class="outer"/>
  <circle cx="430" cy="520" r="260" class="stroke" style="opacity:0.65"/>

  <!-- Cut-out sector (about 120°) to reveal layers -->
  <!-- Sector angles roughly 320° to 80° (wrap), center to the right -->
  <!-- We'll remove a wedge pointing to the right/up-right -->
  <path d="M 430 520 L 690 450 A 260 260 0 0 1 690 590 Z" fill="#ffffff"/>
  <path d="M 430 520 L 690 450 A 260 260 0 0 1 690 590 Z" class="cut"/>

  <!-- Concentric layer wedges visible only on the cut face -->
  <!-- Radii: 70, 115, 160, 205, 250 (outer) -->
  <!-- Outer layer (spiritual) segment -->
  <path d="M 430 520 L 680 470 A 250 250 0 0 1 680 570 Z" class="layer4" opacity="0.25"/>
  <path d="M 430 520 L 635 485 A 205 205 0 0 1 635 555 Z" class="layer3" opacity="0.35"/>
  <path d="M 430 520 L 590 500 A 160 160 0 0 1 590 540 Z" class="layer2" opacity="0.45"/>
  <path d="M 430 520 L 545 510 A 115 115 0 0 1 545 530 Z" class="layer1" opacity="0.55"/>
  <path d="M 430 520 L 500 516 A 70 70 0 0 1 500 524 Z" class="layer0" opacity="0.85"/>

  <!-- Cut boundary emphasis -->
  <path d="M 430 520 L 690 450" class="cut"/>
  <path d="M 430 520 L 690 590" class="cut"/>

  <!-- Axes from core (dotted) -->
  <path d="M 430 520 L 645 500" class="dash"/>
  <path d="M 430 520 L 645 540" class="dash"/>

  <!-- Spikes / distortions: only on outer layers, decaying inward -->
  <!-- Spike along upper axis -->
  <polygon class="spike" points="645,500 690,488 688,512"/>
  <polygon class="spike" points="590,505 620,497 619,513" opacity="0.65"/>
  <polygon class="spike" points="545,510 560,506 560,514" opacity="0.35"/>

  <!-- Spike along lower axis -->
  <polygon class="spike" points="645,540 690,528 688,552"/>
  <polygon class="spike" points="590,535 620,527 619,543" opacity="0.65"/>
  <polygon class="spike" points="545,530 560,526 560,534" opacity="0.35"/>

  <!-- Outside-only label -->
  <rect class="pill" x="170" y="235" width="520" height="56"/>
  <text class="pilltext" x="190" y="268">Снаружи видно: только «духовное / смысловое»</text>

  <!-- Callouts for layers on cut -->
  <path class="call" d="M 720 470 L 980 380"/>
  <text class="h" x="995" y="385">Духовное / смысловое</text>
  <text class="t" x="995" y="405">внешняя поверхность (видно снаружи)</text>

  <path class="call" d="M 705 505 L 980 450"/>
  <text class="h" x="995" y="455">Самоуважение</text>
  <text class="t" x="995" y="475">перекосы/пики могут проявляться</text>

  <path class="call" d="M 685 530 L 980 520"/>
  <text class="h" x="995" y="525">Социальные</text>
  <text class="t" x="995" y="545">контекст, связи, статус</text>

  <path class="call" d="M 660 550 L 980 590"/>
  <text class="h" x="995" y="595">Безопасность</text>
  <text class="t" x="995" y="615">границы, риск, базовые гарантии</text>

  <path class="call" d="M 520 525 L 980 660"/>
  <text class="h" x="995" y="665">Физиология (ядро)</text>
  <text class="t" x="995" y="685">сглажено; пики затухают к центру → 0</text>

  <rect class="pill" x="780" y="735" width="560" height="92"/>
  <text class="pilltext" x="800" y="770">Смысл картинки</text>
  <text class="t" x="800" y="794">Компенсации и «пики» есть на внешних слоях, но в ядре они затухают.</text>
  <text class="t" x="800" y="816">Чтобы увидеть внутреннюю механику, нужен «срез» (наблюдение/диагностика).</text>
</svg>
