<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .title { font: 800 30px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial; fill: #0f172a; }
      .sub { font: 500 18px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial; fill: #334155; }
      .h { font: 800 18px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial; fill: #0f172a; }
      .t { font: 500 16px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial; fill: #0f172a; }
      .muted { font: 500 14px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial; fill: #334155; }
      .col { fill: #f8fafc; stroke: #0f172a; stroke-width: 2; rx: 14; }
      .row { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 12; }
      .tag { fill: #0f172a; rx: 10; }
      .tagtext { font: 800 14px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial; fill: #ffffff; }
      .pill { fill: #e2e8f0; stroke: #64748b; stroke-width: 1.25; rx: 999; }
      .pilltext { font: 700 13px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial; fill: #0f172a; }
      .arrow { stroke: #64748b; stroke-width: 2.5; fill: none; marker-end: url(#m); }
    </style>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="980"/>

  <text class="title" x="70" y="70">Диагностическая связка: L0 ↔ T1–T7 ↔ L5</text>
  <text class="sub" x="70" y="105">Идея: «перекос/дефицит в базисе (L0) → типовой режим (T) → наблюдаемый симптом на поверхности (L5) → первый оператор для стабилизации».</text>

  <!-- Column headers -->
  <rect class="col" x="70" y="150" width="470" height="64"/>
  <rect class="col" x="565" y="150" width="420" height="64"/>
  <rect class="col" x="1010" y="150" width="520" height="64"/>
  <text class="h" x="95" y="191">L0: что «не тянет» (перекос)</text>
  <text class="h" x="590" y="191">Тема (T)</text>
  <text class="h" x="1035" y="191">L5: что видно «сверху» (симптом) + первый оператор</text>

  <!-- Row template settings -->
  <!-- Rows y: 240, 330, 420, 510, 600, 690, 780 -->

  <!-- T1 -->
  <rect class="row" x="70" y="240" width="1460" height="76"/>
  <rect class="tag" x="585" y="262" width="54" height="32"/>
  <text class="tagtext" x="600" y="284">T1</text>
  <text class="t" x="95" y="270">Перегрев контура / нет окна остановки</text>
  <text class="muted" x="95" y="295">ускорение > проверяемость, цена ошибки растёт быстрее буфера</text>
  <text class="t" x="655" y="270">Остановка / пауза как защита причинности</text>
  <text class="t" x="1035" y="270">Срывы, аварийность, «всё срочно», каскад ошибок</text>
  <rect class="pill" x="1035" y="286" width="172" height="24"/>
  <text class="pilltext" x="1050" y="303">старт: L0-C1</text>

  <!-- T2 -->
  <rect class="row" x="70" y="330" width="1460" height="76"/>
  <rect class="tag" x="585" y="352" width="54" height="32"/>
  <text class="tagtext" x="600" y="374">T2</text>
  <text class="t" x="95" y="360">Цена участия не сходится / правду держать слишком дорого</text>
  <text class="muted" x="95" y="385">выход/молчание/саботаж становится рациональным</text>
  <text class="t" x="655" y="360">Отказ участвовать / разрыв связи с ложью</text>
  <text class="t" x="1035" y="360">Уход в тень, имитация, «делаем вид», массовые отказы</text>
  <rect class="pill" x="1035" y="376" width="172" height="24"/>
  <text class="pilltext" x="1050" y="393">старт: L0-C2</text>

  <!-- T3 -->
  <rect class="row" x="70" y="420" width="1460" height="76"/>
  <rect class="tag" x="585" y="442" width="54" height="32"/>
  <text class="tagtext" x="600" y="464">T3</text>
  <text class="t" x="95" y="450">Нет буфера/ресурса → спасаемся перерасходом</text>
  <text class="muted" x="95" y="475">«дотянем на героизме» вместо управления и пересборки нагрузки</text>
  <text class="t" x="655" y="450">Героический режим (перерасход ресурса вместо управления)</text>
  <text class="t" x="1035" y="450">Выгорание, пожары как норма, зависимость от героев, обрыв</text>
  <rect class="pill" x="1035" y="466" width="172" height="24"/>
  <text class="pilltext" x="1050" y="483">старт: L0-C3</text>

  <!-- T4 -->
  <rect class="row" x="70" y="510" width="1460" height="76"/>
  <rect class="tag" x="585" y="532" width="54" height="32"/>
  <text class="tagtext" x="600" y="554">T4</text>
  <text class="t" x="95" y="540">Обязательства > мощность / долг растёт быстрее выполнения</text>
  <text class="muted" x="95" y="565">нужно снижать обещания до базиса, иначе дефолт</text>
  <text class="t" x="655" y="540">Снижение обязательств до базиса (заморозка/урезание)</text>
  <text class="t" x="1035" y="540">Невыполнимость, вечные переносы, деградация качества, кризис</text>
  <rect class="pill" x="1035" y="556" width="172" height="24"/>
  <text class="pilltext" x="1050" y="573">старт: L0-C4</text>

  <!-- T5 -->
  <rect class="row" x="70" y="600" width="1460" height="76"/>
  <rect class="tag" x="585" y="622" width="54" height="32"/>
  <text class="tagtext" x="600" y="644">T5</text>
  <text class="t" x="95" y="630">Токсичный узел/контур заражает остальное</text>
  <text class="muted" x="95" y="655">риск распространяется, нужен барьер/изоляция</text>
  <text class="t" x="655" y="630">Карантин разрыва (изоляция токсичного узла/контура)</text>
  <text class="t" x="1035" y="630">Каскад, заражение, расползание конфликтов/инцидентов</text>
  <rect class="pill" x="1035" y="646" width="172" height="24"/>
  <text class="pilltext" x="1050" y="663">старт: L0-C5</text>

  <!-- T6 -->
  <rect class="row" x="70" y="690" width="1460" height="76"/>
  <rect class="tag" x="585" y="712" width="54" height="32"/>
  <text class="tagtext" x="600" y="734">T6</text>
  <text class="t" x="95" y="720">Нет датчиков/правды → нельзя разложить причину на шаги</text>
  <text class="muted" x="95" y="745">readout ломается, система оптимизирует отчёт</text>
  <text class="t" x="655" y="720">Восстановление обратной связи (сделать правду дешёвой)</text>
  <text class="t" x="1035" y="720">Рост имитации, метрики без эффекта, «непонятно что работает»</text>
  <rect class="pill" x="1035" y="736" width="172" height="24"/>
  <text class="pilltext" x="1050" y="753">старт: L0-C6</text>

  <!-- T7 -->
  <rect class="row" x="70" y="780" width="1460" height="76"/>
  <rect class="tag" x="585" y="802" width="54" height="32"/>
  <text class="tagtext" x="600" y="824">T7</text>
  <text class="t" x="95" y="810">Конфликт осей / дрейф референса / «что считать реальностью»</text>
  <text class="muted" x="95" y="835">политика метрик и интерпретаций становится полем боя</text>
  <text class="t" x="655" y="810">Контроль интерпретации (какие оси считаются реальностью)</text>
  <text class="t" x="1035" y="810">Война метрик, Гудхарт как норма, спор не проверяем</text>
  <rect class="pill" x="1035" y="826" width="172" height="24"/>
  <text class="pilltext" x="1050" y="843">старт: L3-C7</text>

  <!-- Arrows between columns -->
  <path class="arrow" d="M 540 278 L 565 278"/>
  <path class="arrow" d="M 540 368 L 565 368"/>
  <path class="arrow" d="M 540 458 L 565 458"/>
  <path class="arrow" d="M 540 548 L 565 548"/>
  <path class="arrow" d="M 540 638 L 565 638"/>
  <path class="arrow" d="M 540 728 L 565 728"/>
  <path class="arrow" d="M 540 818 L 565 818"/>

  <path class="arrow" d="M 985 278 L 1010 278"/>
  <path class="arrow" d="M 985 368 L 1010 368"/>
  <path class="arrow" d="M 985 458 L 1010 458"/>
  <path class="arrow" d="M 985 548 L 1010 548"/>
  <path class="arrow" d="M 985 638 L 1010 638"/>
  <path class="arrow" d="M 985 728 L 1010 728"/>
  <path class="arrow" d="M 985 818 L 1010 818"/>

  <text class="muted" x="70" y="940">Подсказка: если «любой выбор не меняет траекторию», сначала делай шаг вглубь (readout/базис), и только потом перебирай варианты вширь.</text>
</svg>

